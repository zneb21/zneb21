name: Update profile art

# Refreshes the contribution graph + stats card SVGs from real GitHub data.
# Runs every six hours, whenever you push to main, or on-demand.

"on":
  schedule:
    - cron: "17 */6 * * *"   # every six hours at :17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data
        env:
          GH_PROFILE_USER: zneb21
          # Add PROFILE_GITHUB_TOKEN as a repository secret for private contributions.
          # The built-in token remains a safe public-only fallback.
          GH_PROFILE_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || github.token }}
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py zneb21 contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Bust GitHub README image cache
        env:
          PROFILE_ART_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          version = os.environ["PROFILE_ART_VERSION"]
          text = re.sub(
              r"(contrib-heatmap\.svg\?v=)[^\"]+",
              rf"\g<1>{version}",
              text,
          )
          text = re.sub(
              r"(stats\.svg\?v=)[^\"]+",
              rf"\g<1>{version}",
              text,
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): refresh contribution graphics [skip ci]"
          file_pattern: "README.md data/contributions.json contrib-heatmap.svg stats.svg"
